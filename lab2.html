<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Portfolio</title>
</head>
<body class="text-gray-700">

  <!-- 1. NAVBAR: stacked on mobile, row on md+ -->
  <nav class="bg-white shadow-md p-4 flex flex-col md:flex-row md:justify-between items-center">
    <h1 class="font-bold text-xl text-blue-600">MyPortfolio</h1>
    <ul class="flex gap-4">
      <li><a href="#home">Home</a></li>
      <li><a href="#projects">Projects</a></li>
      <li><a href="#contact">Contact</a></li>
    </ul>
  </nav>

  <section id="home" class="text-center py-20">
    <h2 class="text-5xl font-bold">Hi, I'm Your Name</h2>
    <p class="mt-4">Full Stack Developer</p>
    <a href="#projects" class="inline-block mt-6 bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700">
      View My Work
    </a>
  </section>
  

  <section id="projects" class="max-w-5xl mx-auto p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div class="bg-white rounded-lg shadow-md hover:shadow-xl">
        <img class="w-full h-48 object-cover rounded-t-lg" src="https://picsum.photos/id/1/400/300">
        <div class="p-4">
          <h3 class="font-bold">Project One</h3>
          <p class="text-sm">Short description.</p>
        </div>
      </div>
    </div>
  </section>

      <section id="contact" class="max-w-md mx-auto p-4 mt-8">
    <form>
      <div class="mb-4">
        <label>Name</label>
        <input type="text" class="w-full border rounded-lg p-2">
      </div>
      <div class="mb-4">
        <label>Email</label>
        <input type="email" class="w-full border rounded-lg p-2">
      </div>
      <div class="mb-4">
        <label>Message</label>
        <textarea rows="4" class="w-full border rounded-lg p-2"></textarea>
      </div>
      <button class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700">Send</button>
    </form>
  </section>

  <footer class="bg-gray-800 text-gray-300 text-center p-6 mt-8">
    <div class="flex justify-center gap-6 mb-2">
      <a href="#">GitHub</a>
      <a href="#">LinkedIn</a>
      <a href="#">Instagram</a>
    </div>
    <p class="text-sm">&copy; 2026 Hithesh</p>
  </footer>

</body>
</html>
